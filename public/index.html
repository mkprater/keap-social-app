<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KEAP Homes — Content Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--black:#0A0A0A;--surface:#111;--surface2:#1A1A1A;--surface3:#222;--border:rgba(201,168,76,0.15);--text:#E8E4DC;--muted:#888880;--fb:#1877F2;--ig:#C13584;--tt:#E8E8E8}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh}
.topbar{height:3px;background:linear-gradient(90deg,transparent,var(--gold),#E8C96A,var(--gold),transparent)}
header{padding:28px 32px 20px;max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px}
.logo-k{width:48px;height:48px;background:var(--gold);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--black);flex-shrink:0}
.logo-text h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:3px;color:var(--gold);line-height:1}
.logo-text p{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:3px}
main{max-width:900px;margin:0 auto;padding:0 32px 80px}
.day-tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.day-tab{padding:8px 14px;border-radius:6px;border:1px solid var(--surface3);background:var(--surface);color:var(--muted);font-size:11px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.day-tab:hover{border-color:rgba(201,168,76,0.4);color:var(--text)}
.day-tab.active{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold)}
.day-tab.done{border-color:rgba(5,150,105,0.4);color:#34d399}
.btn-generate{display:inline-flex;align-items:center;gap:10px;padding:14px 36px;background:var(--gold);border:none;border-radius:8px;color:var(--black);font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;transition:all .2s;margin-bottom:32px}
.btn-generate:hover:not(:disabled){background:#E8C96A;transform:translateY(-1px)}
.btn-generate:disabled{background:var(--surface3);color:var(--muted);cursor:not-allowed;transform:none}
.error-box{background:#1a0808;border:1px solid #5a1a1a;border-radius:8px;padding:14px 18px;color:#ff8888;font-size:14px;margin-bottom:20px}
.post-card{background:var(--surface);border:1px solid var(--surface3);border-radius:10px;overflow:hidden;margin-bottom:10px;transition:border-color .2s}
.post-card.open{border-color:rgba(201,168,76,0.3)}
.post-header{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer}
.post-header:hover{background:rgba(255,255,255,0.02)}
.pbadge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:4px;letter-spacing:.5px;flex-shrink:0;min-width:78px;text-align:center}
.tbadge{font-size:10px;font-weight:500;padding:3px 8px;border-radius:4px;flex-shrink:0}
.hook{flex:1;font-size:13px;color:var(--muted);font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chevron{color:var(--muted);font-size:11px;flex-shrink:0;transition:transform .2s}
.post-card.open .chevron{transform:rotate(180deg)}
.post-body{border-top:1px solid var(--surface3);padding:18px;display:none}
.post-text{background:var(--surface2);border-radius:8px;padding:14px;font-size:14px;line-height:1.8;white-space:pre-wrap;margin-bottom:12px}
.hashtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.hashtag{background:rgba(55,138,221,0.1);color:#7eb8f7;font-size:11px;padding:2px 7px;border-radius:4px}
.visual{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.15);border-radius:6px;padding:9px 13px;font-size:12px;color:#ccaa44;margin-bottom:12px}
.btn-copy{padding:8px 16px;background:var(--surface3);border:1px solid var(--surface3);border-radius:6px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn-copy:hover{border-color:rgba(201,168,76,0.4);color:var(--text)}
.btn-copy.copied{background:rgba(5,150,105,0.15);border-color:#059669;color:#34d399}
.badge-fb{background:#1877F2;color:#fff}
.badge-ig{background:#C13584;color:#fff}
.badge-tt{background:#111;color:#E8E8E8;border:1px solid #444}
.tbadge-lend{background:rgba(124,58,237,0.15);color:#a78bfa}
.tbadge-edu{background:rgba(5,150,105,0.15);color:#34d399}
.tbadge-bts{background:rgba(217,119,6,0.15);color:#fbbf24}
.tbadge-mkt{background:rgba(8,145,178,0.15);color:#67e8f9}
.tbadge-mind{background:rgba(220,38,38,0.15);color:#fca5a5}
.loading-msg{color:var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.3);border-top-color:var(--black);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
footer{max-width:900px;margin:0 auto;padding:20px 32px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
footer p{font-size:11px;color:var(--muted);letter-spacing:1px}
</style>
</head>
<body>
<div class="topbar"></div>
<header>
  <div class="logo-k">K</div>
  <div class="logo-text"><h1>KEAP HOMES</h1><p>Social Content Engine</p></div>
</header>
<main>
  <div class="day-tabs" id="day-tabs"></div>
  <button class="btn-generate" id="btn-gen" onclick="generateDay()">
    <span id="btn-icon">⚡</span>
    <span id="btn-label">Generate Day</span>
  </button>
  <div id="error-box" class="error-box" style="display:none"></div>
  <div id="loading-msg" class="loading-msg" style="display:none">Generating content...</div>
  <div id="posts-area"></div>
</main>
<footer>
  <p>KEAP Homes Inc. · Internal use only</p>
  <p id="footer-note"></p>
</footer>
<script>
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAY_SHORT = {Monday:'MON',Tuesday:'TUE',Wednesday:'WED',Thursday:'THU',Friday:'FRI',Saturday:'SAT',Sunday:'SUN'};
const TYPE_CLASS = {'Private Lending':'tbadge-lend','Deal Education':'tbadge-edu','Behind the Scenes':'tbadge-bts','Market Insight':'tbadge-mkt','Mindset':'tbadge-mind'};
const PLAT_CLASS = {Facebook:'badge-fb',Instagram:'badge-ig',TikTok:'badge-tt'};

let activeDay = 0;
let generated = {};

function initTabs() {
  const el = document.getElementById('day-tabs');
  el.innerHTML = DAYS.map((d,i) => `<button class="day-tab${i===0?' active':''}" id="tab-${i}" onclick="switchDay(${i})">${DAY_SHORT[d]}</button>`).join('');
}

function switchDay(i) {
  activeDay = i;
  document.querySelectorAll('.day-tab').forEach((t,j) => t.classList.toggle('active', j===i));
  renderCurrent();
}

function renderCurrent() {
  const postsArea = document.getElementById('posts-area');
  const data = generated[activeDay];
  if (!data) { postsArea.innerHTML = ''; return; }
  postsArea.innerHTML = data.posts.map((p,idx) => {
    const pc = PLAT_CLASS[p.platform] || 'badge-fb';
    const tc = TYPE_CLASS[p.type] || 'tbadge-edu';
    const id = `p-${activeDay}-${idx}`;
    const tags = (p.hashtags||[]).map(h=>`<span class="hashtag">#${h}</span>`).join('');
    return `<div class="post-card" id="${id}">
      <div class="post-header" onclick="toggle('${id}')">
        <span class="pbadge ${pc}">${p.platform}</span>
        <span class="tbadge ${tc}">${p.type}</span>
        <span class="hook">"${esc(p.hook)}"</span>
        <span class="chevron">▼</span>
      </div>
      <div class="post-body">
        <div class="post-text">${esc(p.body)}</div>
        ${tags?`<div class="hashtags">${tags}</div>`:''}
        ${p.visualNote?`<div class="visual">📸 ${esc(p.visualNote)}</div>`:''}
        <button class="btn-copy" id="copy-${id}" onclick="copyPost('${id}')">Copy post</button>
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  const card = document.getElementById(id);
  const body = card.querySelector('.post-body');
  const isOpen = card.classList.contains('open');
  card.classList.toggle('open', !isOpen);
  body.style.display = isOpen ? 'none' : 'block';
}

function copyPost(id) {
  const card = document.getElementById(id);
  const text = card.querySelector('.post-text').textContent;
  const tags = [...card.querySelectorAll('.hashtag')].map(t=>t.textContent).join(' ');
  navigator.clipboard.writeText(text + (tags?'\n\n'+tags:''));
  const btn = document.getElementById('copy-'+id);
  btn.textContent = '✓ Copied!';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='Copy post'; btn.classList.remove('copied'); }, 2000);
}

async function generateDay() {
  const day = DAYS[activeDay];
  setLoading(true);
  hideError();
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({day})
    });
    if (!res.ok) throw new Error('Server error '+res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    generated[activeDay] = data;
    document.getElementById('tab-'+activeDay).classList.add('done');
    renderCurrent();
    updateFooter();
  } catch(e) {
    showError(e.message);
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('btn-gen').disabled = on;
  document.getElementById('loading-msg').style.display = on ? 'block' : 'none';
  document.getElementById('btn-icon').innerHTML = on ? '<div class="spinner"></div>' : '⚡';
  document.getElementById('btn-label').textContent = on ? 'Generating...' : 'Generate Day';
}

function showError(msg) { const e=document.getElementById('error-box'); e.textContent=msg; e.style.display='block'; }
function hideError() { document.getElementById('error-box').style.display='none'; }
function updateFooter() { document.getElementById('footer-note').textContent = Object.keys(generated).length + ' of 7 days generated'; }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

initTabs();
</script>
</body>
</html>
